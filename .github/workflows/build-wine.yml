name: Build (CodeWarrior + Wine)

# Builds Petari on a stock GitHub runner, running the MWCC/MWLD compilers
# under Wine instead of using SMGCommunity's private build container.
#
# Required secret:
#   ORIG_DOL_URL      Direct download URL of the original RMGK01 sys/main.dol
#                     (SHA-1 25c5959534b3c21246c6c7e42021b916b41fb578).
# Optional secret:
#   GAME_ARCHIVE_URL  Direct download URL of a .zip/.tar(.gz|.xz|.zst) of the
#                     game extracted with Dolphin ("Extract Entire Disc").
#                     When set, the built main.dol is booted in headless
#                     Dolphin as a smoke test.
#
# Host both files somewhere private: they are copyrighted game data and must
# never be committed or uploaded as workflow artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      boot_seconds:
        description: Seconds to let the game run in Dolphin
        default: "30"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: [RMGK01]

    env:
      ORIG_DOL_URL: ${{ secrets.ORIG_DOL_URL }}
      GAME_ARCHIVE_URL: ${{ secrets.GAME_ARCHIVE_URL }}
      WINEDEBUG: -all
      WINEPREFIX: ${{ github.workspace }}/.wine
      WINEARCH: win64

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Check secrets
      run: |
        if [ -z "$ORIG_DOL_URL" ]; then
          echo "::error title=Missing ORIG_DOL_URL::Add a repository secret ORIG_DOL_URL pointing to your private copy of orig/${{ matrix.version }}/sys/main.dol. See .github/workflows/build-wine.yml."
          exit 1
        fi
        if [ -z "$GAME_ARCHIVE_URL" ]; then
          echo "::notice title=Dolphin smoke test skipped::Set the GAME_ARCHIVE_URL secret to enable it."
        fi

    - name: Install Wine and Ninja
      run: |
        # The Microsoft apt repo has no i386 packages and breaks multiarch installs.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo dpkg --add-architecture i386
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            wine wine32:i386 wine64 ninja-build
        wine --version
        ninja --version

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Initialize Wine prefix
      run: wineboot --init

    - name: Fetch original DOL
      run: |
        mkdir -p orig/${{ matrix.version }}/sys
        curl -fsSL --retry 3 -o orig/${{ matrix.version }}/sys/main.dol "$ORIG_DOL_URL"
        echo "25c5959534b3c21246c6c7e42021b916b41fb578  orig/${{ matrix.version }}/sys/main.dol" | sha1sum -c -

    # Tool versions (dtk, compilers, binutils, ...) are pinned in configure.py
    - name: Cache tools
      uses: actions/cache@v5
      with:
        path: |
          build/tools
          build/compilers
          build/binutils
        key: tools-${{ hashFiles('configure.py', 'tools/download_tool.py') }}

    - name: Configure
      run: |
        python configure.py --map --version ${{ matrix.version }} --wrapper "$(command -v wine)"

    - name: Build
      run: ninja all_source progress build/${{ matrix.version }}/report.json

    - name: Upload map
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    - name: Upload report
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    # ---- Dolphin smoke test -------------------------------------------------

    - name: Install Dolphin (Flatpak)
      if: env.GAME_ARCHIVE_URL != ''
      run: |
        sudo apt-get install -y -qq --no-install-recommends flatpak
        # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install --user -y --noninteractive flathub org.DolphinEmu.dolphin-emu
        flatpak info --user org.DolphinEmu.dolphin-emu

    - name: Fetch game files
      if: env.GAME_ARCHIVE_URL != ''
      run: |
        mkdir -p "$RUNNER_TEMP/game"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/game.archive" "$GAME_ARCHIVE_URL"
        case "$(file -b --mime-type "$RUNNER_TEMP/game.archive")" in
          application/zip) unzip -q "$RUNNER_TEMP/game.archive" -d "$RUNNER_TEMP/game" ;;
          *) tar -xf "$RUNNER_TEMP/game.archive" -C "$RUNNER_TEMP/game" ;;
        esac
        rm -f "$RUNNER_TEMP/game.archive"

    - name: Boot in Dolphin (headless)
      if: env.GAME_ARCHIVE_URL != ''
      run: |
        tools/ci/dolphin_smoke_test.sh \
            "$RUNNER_TEMP/game" \
            build/${{ matrix.version }}/main.dol \
            "${{ inputs.boot_seconds || '30' }}" \
            "$RUNNER_TEMP/dolphin-logs"

    - name: Upload Dolphin logs
      if: always() && env.GAME_ARCHIVE_URL != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.version }}_dolphin_logs
        path: ${{ runner.temp }}/dolphin-logs
        if-no-files-found: ignore
